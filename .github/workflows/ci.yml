name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  dev-scenarios:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install dependencies
        run: npm ci

      - name: Start Supabase
        run: npx supabase start

      - name: Reset database
        run: npm run supabase:reset

      - name: Sync .env from Supabase
        run: node scripts/sync-env-from-supabase.mjs

      - name: Start Vite dev server
        run: npm run dev &

      - name: Wait for dev server
        run: |
          for i in $(seq 1 45); do
            if curl -sf http://localhost:5173/dev > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Dev server did not become ready"
          exit 1

      - name: Run dev scenario smoke test
        run: npm run test:dev-scenarios
